spring.application.name=smart-canteen
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_canteen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:bharthi}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security and session cookie configuration
server.servlet.session.cookie.name=CANTEEN_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App specific configuration
app.college.email-domain=${COLLEGE_EMAIL_DOMAIN:}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

logging.level.com.canteen=INFO
logging.level.org.springframework.security=INFO
