databases:
  - name: smart-canteen-db
    plan: free
    region: oregon
    databaseName: smart_canteen
    user: canteen_user

services:
  - type: web
    name: smart-canteen
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: smart-canteen-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: ""
      - key: COOKIE_SAME_SITE
        value: lax
      - key: COOKIE_SECURE
        value: "false"
